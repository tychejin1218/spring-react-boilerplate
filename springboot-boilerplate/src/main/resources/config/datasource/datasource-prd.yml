# Main 데이터베이스 설정 (운영)
# 운영 값은 저장소에 두지 않는다. 배포 환경(ECS 작업 정의, Secrets Manager 등)의 환경변수로 넣는다.
# 기본값이 없는 항목은 환경변수가 없으면 앱이 시작하지 않는다 (값 누락을 배포 시점에 바로 알기 위함).
main:
  datasource:
    driver-class-name: software.aws.rds.jdbc.mysql.Driver
    writer-jdbc-url: ${MAIN_DATASOURCE_WRITER_JDBC_URL}
    reader-jdbc-url: ${MAIN_DATASOURCE_READER_JDBC_URL}
    username: ${MAIN_DATASOURCE_USERNAME}
    password: ${MAIN_DATASOURCE_PASSWORD}
    hikari:
      poolName: mysqlDbConnectionPool
      maximum-pool-size: ${MAIN_DATASOURCE_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${MAIN_DATASOURCE_MINIMUM_IDLE:3}
      idle-timeout: 10000
      max-life-time: 300000
      connection-test-query: SELECT 1
  jpa:
    generate-ddl: false
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: false
        jdbc.time_zone: UTC

# Redis 설정
redis:
  cluster:
    nodes: ${REDIS_CLUSTER_NODES}
