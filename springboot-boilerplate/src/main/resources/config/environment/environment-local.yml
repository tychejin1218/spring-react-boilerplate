# CORS 설정 (allowCredentials=true 이므로 "*" 대신 오리진을 명시한다. 쉼표로 여러 개 가능)
cors:
  allowed-origins: "http://localhost:5173,http://localhost:80,http://localhost"

# Jasypt 설정
# 암호화 비밀번호: JASYPT_ENCRYPTOR_PASSWORD 환경변수로 오버라이드
# 암호화 값 생성: ./gradlew jasyptEncrypt --args="<비밀번호> <평문>"
jasypt:
  encryptor:
    bean: jasyptStringEncryptor
    password: local-default

# Spring 설정
spring:
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: localhost
    port: 1025  # MailHog SMTP 포트
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

# 이메일 인증 설정
mail:
  from: noreply@boilerplate.local
  verify-url: http://localhost:5173/verify-email
  password-reset-url: http://localhost:5173/reset-password

# JWT 설정
jwt:
  secret: local-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  access-token-validity-ms: 900000     # 15분 (session-idle-timeout-ms 30분보다 짧게)
  # 미활동 만료, 절대 만료는 application.yml 의 jwt.session-* 기본값(30분, 12시간)을 쓴다

# SpringDoc 설정
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha
    filter: true
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  override-with-generic-response: false
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# AWS 설정 (로컬: MinIO Docker 사용. endpoint 가 없으면 DefaultCredentialsProvider 체인(IAM Role 등) 사용)
aws:
  s3:
    region: us-east-1
    bucket-name: boilerplate-bucket
    presigned-url-expiry-minutes: 5
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
