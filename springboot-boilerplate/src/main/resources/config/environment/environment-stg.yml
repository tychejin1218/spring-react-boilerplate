# CORS 설정
# 쉼표로 여러 도메인 지정. "*" 는 쿠키, 인증 헤더와 함께 쓰면 위험하므로 실제 도메인을 적는다
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-stg-frontend-domain}

# JWT 설정
jwt:
  secret: change-me-stg-jwt-secret-key-must-be-at-least-256-bits-long
  access-token-validity-ms: 900000     # 15분 (jwt.session-idle-timeout-ms 30분보다 짧게)
  # 미활동 만료, 절대 만료는 application.yml 의 jwt.session-* 기본값(30분, 12시간)을 쓴다

# SpringDoc 설정
springdoc:
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    groups-order: asc
    tags-sorter: alpha
    operations-sorter: alpha
    filter: true
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  override-with-generic-response: false
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

# AWS 설정
aws:
  s3:
    region: ap-northeast-2
    bucket-name: your-stg-bucket-name
    presigned-url-expiry-minutes: 5
