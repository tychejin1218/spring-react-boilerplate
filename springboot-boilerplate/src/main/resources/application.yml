# SERVER 설정
server:
  port: 9091
  servlet:
    context-path: /api
  error:
    path: /error
    whitelabel:
      enabled: false
  shutdown: graceful

# SPRING 설정
spring:
  application:
    name: springboot-boilerplate
  web:
    locale: ko_KR
    resources:
      add-mappings: false
  messages:
    basename: message/messages
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  # 메일 발송 기본값. 프로파일 yml 또는 MAIL_HOST 등 환경변수로 재정의한다
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  profiles:
    active: local
    group:
      local: profiles-local
        , logging-type-console, logging-level-local
      dev: profiles-dev
        , logging-type-file-absolute, logging-level-dev
      stg: profiles-stg
        , logging-type-file-absolute, logging-level-stg
      prd: profiles-prd
        , logging-type-file-absolute, logging-level-prd

# 이메일 인증/비밀번호 재설정 링크 기본값 (프로파일 yml 또는 환경변수로 재정의)
mail:
  from: ${MAIL_FROM:noreply@example.com}
  verify-url: ${MAIL_VERIFY_URL:http://localhost:5173/verify-email}
  password-reset-url: ${MAIL_PASSWORD_RESET_URL:http://localhost:5173/reset-password}

# Rate Limit 설정
# 세션 만료 정책. 환경별 yml 이나 환경변수로 재정의한다
# access-token-validity-ms(환경별 yml)는 session-idle-timeout-ms 보다 짧아야 미활동 만료가 동작한다
jwt:
  session-idle-timeout-ms: ${JWT_SESSION_IDLE_TIMEOUT_MS:1800000}          # 미활동 만료 30분
  session-absolute-timeout-ms: ${JWT_SESSION_ABSOLUTE_TIMEOUT_MS:43200000} # 최초 로그인 기준 절대 만료 12시간

rate-limit:
  # true 이면 X-Forwarded-For 첫 값을 클라이언트 IP 로 사용한다.
  # 신뢰할 수 있는 리버스 프록시(ALB, nginx) 뒤에서만 켠다. 기본은 remoteAddr 사용.
  trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

---
# LOCAL 설정
spring.config.activate.on-profile: "profiles-local"
spring:
  config:
    import:
      classpath:config/datasource/datasource-local.yml,
      classpath:config/environment/environment-local.yml

---
# DEV 설정
spring.config.activate.on-profile: "profiles-dev"
spring:
  config:
    import:
      classpath:config/datasource/datasource-dev.yml,
      classpath:config/environment/environment-dev.yml

---
# STG 설정
spring.config.activate.on-profile: "profiles-stg"
spring:
  config:
    import:
      classpath:config/datasource/datasource-stg.yml,
      classpath:config/environment/environment-stg.yml

---
# PRD 설정
spring.config.activate.on-profile: "profiles-prd"
spring:
  config:
    import:
      classpath:config/datasource/datasource-prd.yml,
      classpath:config/environment/environment-prd.yml
